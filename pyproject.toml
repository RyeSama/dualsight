[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsight"
version = "0.1.0"
description = "Give text-only LLMs eyes: an OpenAI-compatible dual-AI vision perception bridge."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DualSight Contributors" }]
keywords = ["llm", "vision", "multimodal", "openai", "proxy", "vlm", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "pillow>=10.0",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/RyeSama/dualsight"
Documentation = "https://github.com/RyeSama/dualsight/tree/main/docs"
Repository = "https://github.com/RyeSama/dualsight"
Issues = "https://github.com/RyeSama/dualsight/issues"
Changelog = "https://github.com/RyeSama/dualsight/blob/main/CHANGELOG.md"

[project.scripts]
dualsight = "dualsight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dualsight = [
  "py.typed",
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.svg",
  "static/samples/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "error::DeprecationWarning:dualsight.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["dualsight"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
