name: dualsight

services:
  dualsight:
    build:
      context: .
    image: dualsight:0.1.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DUALSIGHT_HOST: 0.0.0.0
      DUALSIGHT_PORT: "8000"
      DUALSIGHT_CACHE: sqlite
      DUALSIGHT_CACHE_PATH: /data/cache.sqlite3
    volumes:
      - dualsight-cache:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  dualsight-cache:
