name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest -q

  package:
    name: Build and inspect distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify static assets are packaged
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "dualsight/static/index.html",
              "dualsight/static/styles.css",
              "dualsight/static/app.js",
              "dualsight/static/favicon.svg",
              "dualsight/static/samples/sample-card.png",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          print(f"{wheel}: {len(names)} files, static assets present")
          PY

      - name: Smoke-install the wheel
        run: |
          python -m venv /tmp/dualsight-smoke
          /tmp/dualsight-smoke/bin/pip install dist/*.whl
          /tmp/dualsight-smoke/bin/dualsight --version
          DUALSIGHT_MOCK=true /tmp/dualsight-smoke/bin/dualsight doctor --json > /tmp/doctor.json
          cat /tmp/doctor.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
